<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Buyer-Finder</title>

  <!-- Stop browsers from serving stale builds -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Leaflet (map) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""
  ></script>

  <style>
    :root {
      --teal: #00a9b7;
      --bg: #f3f8fb;
      --card: #fff;
      --muted: #96a0aa;
      --sale-bg: #eafaf1;
      --sale-fg: #00b35f;
      --req-bg: #fef7e1;
      --req-fg: #c59a00;
      --danger: #c62828;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: #0e1116;
    }

    header {
      position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; gap: 12px;
      padding: 10px 16px; background: #fff; border-bottom: 1px solid #e5e8ec;
    }
    header h1 { font-size: 1.1rem; margin: 0; }
    header .search { flex: 1; }
    header .search input {
      width: 100%; padding: 8px 10px;
      border: 1px solid #d5dbe1; border-radius: 10px;
    }

    .signin-banner {
      background: var(--teal); color: #fff;
      text-align: center; padding: 10px; cursor: pointer;
    }
    .whoami { text-align: center; font-size: 0.9rem; color: var(--muted); padding: 8px 0; }

    .tab-container { display: flex; gap: 8px; padding: 10px; }
    .tab-container button {
      flex: 1; padding: 10px; border: none; border-radius: 12px;
      font-weight: 700; cursor: pointer; background: #e0f4f7;
    }
    .tab-container button.active { background: var(--teal); color: white; }

    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px; padding: 12px;
    }
    .card {
      background: var(--card); border-radius: 12px; padding: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .card img { width: 100%; height: 130px; object-fit: cover; border-radius: 10px; }
    .card h3 { font-size: 1rem; margin: 8px 0 4px; }
    .price { font-weight: 700; margin-bottom: 6px; }
    .tag { display: inline-block; padding: 4px 8px; border-radius: 8px; font-size: 0.8rem; }
    .meta { color: var(--muted); font-size: 0.78rem; margin-top: 6px; }

    nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 6;
      display: flex; justify-content: space-around; align-items: center;
      padding: 8px 0; background: #fff;
      border-top: 1px solid #e5e8ec;
    }
    nav button {
      background: none; border: none; font-weight: 700; font-size: 0.95rem; padding: 8px 10px;
    }
    .add-btn {
      background: var(--teal); color: #fff;
      width: 58px; height: 58px; border-radius: 50%;
      border: none; font-size: 2rem; display: flex;
      align-items: center; justify-content: center;
      position: relative; top: -18px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.18);
    }

    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.35);
      display: none; align-items: center; justify-content: center; z-index: 20;
    }
    .modal.open { display: flex; }

    .sheet {
      width: min(560px, 92vw);
      background: #fff; border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .sheet h2 { margin-top: 0; }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .field { margin-bottom: 10px; }
    .field label { display: block; margin-bottom: 6px; font-weight: 600; }
    .field input, .field select {
      width: 100%; padding: 10px; border: 1px solid #d5dbe1; border-radius: 10px;
    }

    .preview {
      width: 100%; height: 160px; background: #f4f6f8;
      border: 1px dashed #cbd5df; border-radius: 12px;
      display: grid; place-items: center; overflow: hidden;
    }
    .preview img { width: 100%; height: 100%; object-fit: cover; }

    .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 12px; }
    .btn { padding: 10px 14px; border-radius: 10px; border: none; font-weight: 700; cursor: pointer; }
    .btn.primary { background: var(--teal); color: #fff; }
    .btn.muted { background: #eef2f6; }
    .btn.danger { background: var(--danger); color: #fff; }

    .hidden { display: none !important; }

    .toast {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: 90px; background: #111; color: #fff;
      padding: 10px 14px; border-radius: 10px;
      display: none; z-index: 50;
    }
    .toast.show { display: block; }
  </style>
</head>
<body>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(reg => reg.forEach(r => r.unregister()));
    }
    try { localStorage.clear(); sessionStorage.clear(); } catch(e){}
  </script>

  <header>
    <h1>🔍 Buyer-Finder</h1>
    <div class="search"><input id="search" type="search" placeholder="Search posts..."></div>
  </header>

  <div id="signinBanner" class="signin-banner">🔒 You’re not signed in — tap to sign in</div>
  <div id="whoami" class="whoami hidden"></div>

  <div class="tab-container">
    <button id="tabSelling" class="active">Selling</button>
    <button id="tabRequests">Requests</button>
  </div>

  <div id="selling" class="grid"></div>
  <div id="requests" class="grid" style="display:none;"></div>

  <!-- MAP MODAL ONLY (no map-section anywhere else) -->
  <div class="modal" id="mapModal">
    <div class="sheet">
      <h2>Map</h2>
      <div id="map" style="width:100%;height:360px;border-radius:12px;background:#d0e8f2;"></div>
      <div class="actions">
        <button class="btn muted" id="closeMap">Close</button>
      </div>
    </div>
  </div>

  <!-- POST MODAL -->
  <div class="modal" id="postModal">
    <div class="sheet">
      <h2>Add a Post</h2>
      <div class="row">
        <div>
          <div class="field">
            <label>Title</label>
            <input id="title">
          </div>
          <div class="field">
            <label>Price</label>
            <input id="price" type="number">
          </div>
          <div class="field">
            <label>Type</label>
            <select id="type">
              <option value="sale">Selling</option>
              <option value="request">Request</option>
            </select>
          </div>
          <div class="field">
            <label>Photo</label>
            <input id="image" type="file" accept="image/*">
          </div>
        </div>
        <div>
          <div class="field">
            <label>Preview</label>
            <div id="preview" class="preview"><span>No image selected</span></div>
          </div>
          <div class="row">
            <div class="field"><label>Lat</label><input id="lat" type="number" step="any"></div>
            <div class="field"><label>Lng</label><input id="lng" type="number" step="any"></div>
          </div>
        </div>
      </div>
      <div class="actions">
        <button id="cancelPost" class="btn muted">Cancel</button>
        <button id="savePost" class="btn primary">Save</button>
      </div>
    </div>
  </div>

  <!-- SETTINGS MODAL -->
  <div class="modal" id="settingsModal">
    <div class="sheet">
      <h2>Settings</h2>
      <div><strong>Name:</strong> <span id="s_name"></span></div>
      <div><strong>Email:</strong> <span id="s_email"></span></div>
      <div><strong>Premium:</strong> <span id="s_premium"></span></div>

      <div class="actions">
        <button id="closeSettings" class="btn muted">Close</button>
        <button id="requestUpgrade" class="btn primary">Upgrade</button>
        <button id="signOutBtn" class="btn danger">Sign Out</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <nav>
    <button id="navSell">Selling</button>
    <button id="navReq">Requests</button>
    <button id="addPost" class="add-btn">+</button>
    <button id="navMap">Map</button>
    <button id="navSettings">Settings</button>
  </nav>

  <script>
    const supabaseUrl = "https://hcgwldsslzkppzgfhwws.supabase.co";
    const supabaseKey = "eyJhbGciOiJIUzI1NiIsIn...";
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    let currentUser = null;
    let profile = null;
    let isPremium = false;
    let allPosts = [];
    let MAP = null, markersLayer = null;

    const sellingEl = document.getElementById("selling");
    const requestsEl = document.getElementById("requests");
    const searchEl = document.getElementById("search");
    const whoami = document.getElementById("whoami");
    const signinBanner = document.getElementById("signinBanner");

    const mapModal = document.getElementById("mapModal");
    const closeMapBtn = document.getElementById("closeMap");

    const settingsModal = document.getElementById("settingsModal");
    const sName = document.getElementById("s_name");
    const sEmail = document.getElementById("s_email");
    const sPremium = document.getElementById("s_premium");
    const closeSettingsBtn = document.getElementById("closeSettings");

    async function init() {
      setupNav();
      setupPostModal();
      setupSettings();
      setupMapModal();
      await refreshUser();
      await loadPosts();
      subscribeRealtime();
    }
    init();

    // --- Auth ---
    signinBanner.addEventListener("click", async () => {
      const m = prompt("Sign in:\n1 = Google\n2 = Email", "1");
      if (m === "2") {
        const email = prompt("Enter email:");
        if (!email) return;
        await supabase.auth.signInWithOtp({ email });
        alert("Check your email for login link.");
      } else {
        await supabase.auth.signInWithOAuth({ provider: "google" });
      }
    });

    supabase.auth.onAuthStateChange(async () => {
      await refreshUser();
    });

    async function refreshUser() {
      const { data } = await supabase.auth.getUser();
      currentUser = data.user;
      if (!currentUser) {
        whoami.classList.add("hidden");
        signinBanner.classList.remove("hidden");
        return;
      }
      signinBanner.classList.add("hidden");

      profile = await loadProfile(currentUser.id);
      isPremium = !!profile?.premium;

      whoami.classList.remove("hidden");
      whoami.textContent = `${profile.username || "User"}${isPremium ? " • Premium" : ""}`;
    }

    async function loadProfile(uid) {
      let { data, error } = await supabase
        .from("profiles")
        .select("username,email,premium")
        .eq("id", uid)
        .single();
      if (error) {
        return { username: currentUser.email, email: currentUser.email, premium: false };
      }
      return data;
    }

    // --- Nav ---
    function setupNav() {
      document.getElementById("navSell").onclick = () => showTab("selling");
      document.getElementById("navReq").onclick = () => showTab("requests");
      document.getElementById("navMap").onclick = () => onMapPressed();
      document.getElementById("navSettings").onclick = () => openSettings();
      document.getElementById("tabSelling").onclick = () => showTab("selling");
      document.getElementById("tabRequests").onclick = () => showTab("requests");
    }

    function showTab(tab) {
      sellingEl.style.display = tab === "selling" ? "grid" : "none";
      requestsEl.style.display = tab === "requests" ? "grid" : "none";
      document.getElementById("tabSelling").classList.toggle("active", tab === "selling");
      document.getElementById("tabRequests").classList.toggle("active", tab === "requests");
    }

    // --- Map Logic ---
    function onMapPressed() {
      if (!currentUser) return alert("Sign in first.");
      if (!isPremium) return alert("Map is a premium feature.");
      openMap();
    }

    function setupMapModal() {
      closeMapBtn.onclick = () => mapModal.classList.remove("open");
    }

    function openMap() {
      mapModal.classList.add("open");
      if (!MAP) {
        MAP = L.map("map");
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19,
        }).addTo(MAP);
        markersLayer = L.layerGroup().addTo(MAP);
        MAP.setView([39.5, -98.35], 4);
      }
      MAP.invalidateSize();
      renderMap();
    }

    function renderMap() {
      if (!MAP || !markersLayer) return;
      markersLayer.clearLayers();
      allPosts.forEach(p => {
        if (p.latitude && p.longitude) {
          L.marker([p.latitude, p.longitude]).bindPopup(`
            <strong>${p.title}</strong><br>$${p.price}
          `).addTo(markersLayer);
        }
      });
    }

    // --- Posts ---
    async function loadPosts() {
      const { data } = await supabase
        .from("posts")
        .select("*")
        .order("created_at", { ascending: false });
      allPosts = data || [];
      renderPosts();
    }

    function renderPosts() {
      sellingEl.innerHTML = "";
      requestsEl.innerHTML = "";
      allPosts.forEach(p => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <img src="${p.image_url || "https://via.placeholder.com/150"}">
          <h3>${p.title}</h3>
          <div class="price">$${p.price}</div>
          <div class="tag" style="background:${p.type==='sale'?'var(--sale-bg)':'var(--req-bg)'};color:${p.type==='sale'?'var(--sale-fg)':'var(--req-fg)'};">
            ${p.type}
          </div>
          <div class="meta">${p.username}</div>
        `;
        if (p.type === "sale") sellingEl.appendChild(card);
        else requestsEl.appendChild(card);
      });
    }

    function subscribeRealtime() {
      supabase.channel("posts")
        .on("postgres_changes", { event: "INSERT", schema: "public", table: "posts" },
          payload => {
            allPosts.unshift(payload.new);
            renderPosts();
          }
        ).subscribe();
    }

    // --- Add Post Modal ---
    function setupPostModal() {
      document.getElementById("addPost").onclick = () => {
        if (!currentUser) return alert("Sign in first.");
        document.getElementById("postModal").classList.add("open");
      };
      document.getElementById("cancelPost").onclick = () =>
        document.getElementById("postModal").classList.remove("open");

      document.getElementById("savePost").onclick = savePost;
      document.getElementById("image").onchange = handlePreview;
    }

    function handlePreview() {
      const file = image.files?.[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      document.getElementById("preview").innerHTML = `<img src="${url}">`;
    }

    async function savePost() {
      const title = document.getElementById("title").value.trim();
      const price = parseFloat(document.getElementById("price").value);
      const type = document.getElementById("type").value;
      const file = document.getElementById("image").files?.[0];

      let image_url = null;
      if (file) {
        const safeName = `${currentUser.id}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g,"_")}`;
        await supabase.storage.from("post_images").upload(safeName, file);
        const { data:pub } = supabase.storage.from("post_images").getPublicUrl(safeName);
        image_url = pub.publicUrl;
      }

      await supabase.from("posts").insert([{
        title, price, type,
        image_url,
        username: profile.username,
        user_id: currentUser.id,
        latitude: parseFloat(document.getElementById("lat").value) || null,
        longitude: parseFloat(document.getElementById("lng").value) || null
      }]);

      document.getElementById("postModal").classList.remove("open");
      await loadPosts();
    }

    // --- Settings ---
    function setupSettings() {
      closeSettingsBtn.onclick = () => settingsModal.classList.remove("open");
      document.getElementById("signOutBtn").onclick = async () => {
        await supabase.auth.signOut();
        settingsModal.classList.remove("open");
      };
      document.getElementById("requestUpgrade").onclick = () => {
        alert("Upgrade flow will be added later.");
      };
    }

    function openSettings() {
      if (!currentUser) return alert("Sign in first.");

      sName.textContent = profile.username || "User";
      sEmail.textContent = profile.email || currentUser.email || "—";
      sPremium.textContent = isPremium ? "Yes" : "No";
      settingsModal.classList.add("open");
    }
  </script>
</body>
</html>
